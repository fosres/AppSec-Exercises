name: Terraform Security Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'aws/terraform/terraworkspace/**'
  pull_request:
    branches:
      - main
    paths:
      - 'aws/terraform/terraworkspace/**'
  workflow_dispatch:

# Default all permissions to read-only
permissions:
  contents: read

jobs:
  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: aws/terraform/terraworkspace
          framework: terraform
          soft_fail: false

  terraform_apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: checkov
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Override at job level — only this job needs id-token
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::510537392097:role/github-actions-terraform
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v0.68.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Apply global/s3 first
        working-directory: aws/terraform/terraworkspace/global/s3
        run: terragrunt apply --terragrunt-non-interactive

      - name: Apply all modules
        working-directory: aws/terraform/terraworkspace
        run: terragrunt run --all apply --terragrunt-non-interactive
