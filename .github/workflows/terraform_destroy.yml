name: Terraform Destroy

on:
  workflow_dispatch:

# Default all permissions to read-only
permissions:
  contents: read

jobs:
  terraform_destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::510537392097:role/github-actions-terraform
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v1.0.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Clear Terragrunt cache
        run: |
          find . -maxdepth 10 -type d -name ".terragrunt-cache" | xargs rm -rf 2>/dev/null || true

      - name: Destroy all modules
        working-directory: aws/terraform/terraworkspace
        run: |
          terragrunt run --all destroy \
            --non-interactive \
            --queue-exclude-dir global/s3
